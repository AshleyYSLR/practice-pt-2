<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>tap me</title>
<meta property="og:title" content="tap me">
<meta property="og:description" content="tap me">
<meta name="twitter:title" content="tap me">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --ink:#3a4a2a;--pink:#f0a9b8;--pinkdark:#d97e93;--cheese:#ffd24a;
    --straw:#e8425f;--vomit:#4aa8ff;--accent:#e0955f;--red:#ff2b3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Courier New",monospace;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden;touch-action:none;
    image-rendering:pixelated;}
  #sky{position:absolute;inset:0;
    background:linear-gradient(#8fd0f0 0%,#a9dcf2 45%,#cdeaf7 60%,#cdeaf7 60%);}
  .cloud{position:absolute;image-rendering:pixelated;opacity:.9;
    animation:drift linear infinite;}
  @keyframes drift{from{transform:translateX(-140px);}to{transform:translateX(120vw);}}
  #hills{position:absolute;left:0;right:0;bottom:24%;height:22%;
    background:#7cc06a;border-top:6px solid #6fb35d;border-radius:50% 50% 0 0/100% 100% 0 0;
    transform:scaleX(1.4);}
  #hills2{position:absolute;left:-10%;right:40%;bottom:24%;height:16%;
    background:#8ecb72;border-radius:50% 50% 0 0/100% 100% 0 0;transform:scaleX(1.6);}
  #grass{position:absolute;left:0;right:0;bottom:0;height:26%;
    background:#6fb35d;border-top:6px solid #5fa04e;}
  #grass::after{content:"";position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(90deg,transparent 0 22px,rgba(70,140,60,.5) 22px 24px),
      repeating-linear-gradient(0deg,transparent 0 18px,rgba(95,170,80,.35) 18px 20px);}
  .blade{position:absolute;bottom:0;width:3px;background:#4e9440;
    transform-origin:bottom;animation:sway 2.6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}

  #mouseWrap{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);
    image-rendering:pixelated;touch-action:none;z-index:5;width:200px;height:130px;
    display:flex;align-items:center;justify-content:center;}
  #mouseWrap.grabbable{cursor:grab;}
  #mouseWrap.grabbing{cursor:grabbing;}
  #mouseInner{position:relative;display:inline-block;line-height:0;}
  #mouseImg{image-rendering:pixelated;height:120px;width:auto;display:block;
    transition:none;}
  #hatCv{position:absolute;image-rendering:pixelated;pointer-events:none;
    width:32px;height:38px;transform-origin:50% 92%;}
  #mouseInner.pose-sit #hatCv{left:30%;top:-11%;transform:rotate(-6deg);}
  #mouseInner.pose-walk #hatCv{left:14%;top:8%;transform:rotate(-20deg);}

  canvas{image-rendering:pixelated;display:block;}
  .banner{position:absolute;left:50%;transform:translateX(-50%);top:34px;
    font-size:19px;letter-spacing:2px;color:#2c3a1f;text-transform:uppercase;
    text-align:center;text-shadow:1px 1px 0 #d7f0c8;opacity:0;transition:opacity .35s;
    pointer-events:none;width:90%;line-height:1.5;}
  .banner.show{opacity:1;}
  .banner .arrow{display:inline-block;color:#e0722f;animation:swipe 1s steps(2) infinite;}
  @keyframes swipe{0%{transform:translateX(-8px);}100%{transform:translateX(8px);}}
  .hint{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;
    font-size:16px;letter-spacing:1px;color:#2c3a1f;text-transform:lowercase;
    text-shadow:1px 1px 0 #d7f0c8;opacity:0;transition:opacity .35s;pointer-events:none;text-align:center;}
  .hint.show{opacity:1;}
  #pool{position:absolute;z-index:3;transform:translate(-50%,0) scale(0);
    transform-origin:center top;transition:transform .5s cubic-bezier(.2,1.4,.4,1);}
  #dateQ{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:12;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s;
    width:min(340px,88vw);}
  #dateQ.show{opacity:1;pointer-events:auto;}
  #dateQ .float{animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .qbox{background:rgba(255,255,255,.86);border:3px solid var(--pinkdark);
    padding:18px 20px;box-shadow:0 0 0 3px #fff,6px 6px 0 rgba(80,120,60,.35);}
  .qbox .q-main{margin:0 0 16px;color:var(--ink);font-size:16px;letter-spacing:.5px;line-height:1.45;}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .pxbtn{font-family:inherit;font-size:15px;letter-spacing:2px;text-transform:uppercase;
    padding:9px 22px;cursor:pointer;color:#4a3a1a;background:var(--cheese);border:none;
    box-shadow:3px 3px 0 rgba(80,120,60,.5);transition:transform .08s;}
  .pxbtn.no{background:var(--pink);}
  .pxbtn.wide{font-size:12px;letter-spacing:.3px;padding:10px 14px;
    white-space:normal;max-width:150px;line-height:1.35;}
  .pxbtn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000;}
  #bubbles{position:absolute;z-index:8;inset:0;display:none;
    align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;padding:20px;}
  #bubbles.show{display:flex;}
  .bubble{position:relative;width:min(240px,80vw);height:190px;cursor:pointer;
    border:4px solid #fff;overflow:hidden;box-shadow:6px 6px 0 rgba(80,120,60,.5);
    image-rendering:pixelated;transition:transform .12s;animation:bob 3s ease-in-out infinite;}
  .bubble:nth-child(2){animation-delay:.4s;}
  .bubble:hover{transform:scale(1.04);}
  .bubble:active{transform:scale(.97);}
  .bubble canvas{position:absolute;inset:0;width:100%;height:100%;}
  .bubble .label{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;color:#fff;
    font-size:15px;letter-spacing:1px;line-height:1.6;text-shadow:2px 2px 0 #000,0 0 8px #000;padding:10px;}
  .bubble .label .big{font-size:18px;font-weight:bold;margin-bottom:4px;}
  .bubble .tag{position:absolute;top:8px;left:8px;z-index:2;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:2px 2px 0 #000;}
  #farewell,#proposeBox{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);
    z-index:9;opacity:0;transition:opacity .8s,transform .8s;text-align:center;
    pointer-events:none;width:min(360px,88vw);}
  #farewell.show,#proposeBox.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
  #farewell .card,#proposeBox .card{background:rgba(255,255,255,.82);border:3px solid var(--pinkdark);
    padding:20px 22px;box-shadow:0 0 0 3px #fff,6px 6px 0 rgba(80,120,60,.35);}
  #farewell .big,#proposeBox .big{font-size:24px;letter-spacing:1px;color:var(--pinkdark);line-height:1.4;}
  #farewell .mid{margin-top:10px;font-size:15px;letter-spacing:1px;color:var(--ink);}
  #farewell .pick,#proposeBox .pick{margin-top:4px;font-size:17px;letter-spacing:1px;color:#c46a2e;
    font-weight:bold;white-space:pre-wrap;line-height:1.5;}
  #farewell .end,#proposeBox .end{margin-top:14px;font-size:20px;letter-spacing:2px;color:var(--pinkdark);}
  #calBtn{margin-top:16px;display:inline-flex;align-items:center;gap:8px;
    font-family:inherit;font-size:13px;letter-spacing:1px;text-transform:uppercase;
    padding:10px 18px;cursor:pointer;color:#fff;background:#4285F4;border:none;
    box-shadow:3px 3px 0 rgba(80,120,60,.5);text-decoration:none;transition:transform .08s;}
  #calBtn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000;}
  #reset{position:absolute;top:14px;right:16px;font-family:inherit;font-size:11px;
    letter-spacing:1px;color:#3c5a2f;background:rgba(255,255,255,.5);border:1px solid #6fb35d;
    padding:6px 10px;cursor:pointer;z-index:10;text-transform:uppercase;}
  #reset:hover{color:#1c2a12;border-color:#1c2a12;}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="hills2"></div>
  <div id="hills"></div>
  <div id="grass"></div>

  <div class="banner" id="banner"></div>
  <canvas id="pool" width="220" height="90"></canvas>

  <div id="mouseWrap" class="grabbable">
    <div id="mouseInner">
      <img id="mouseImg" alt="mouse">
      <canvas id="hatCv" width="22" height="26"></canvas>
    </div>
  </div>

  <div class="hint" id="hint"></div>

  <div id="dateQ"><div class="float"><div class="qbox">
    <p class="q-main">Where do u want to eat your birthday cake Chris?</p>
    <div class="row">
      <button class="pxbtn wide" id="oceanBtn">by the ocean (i had to)</button>
      <button class="pxbtn wide no" id="peakBtn">by the peak</button>
    </div>
  </div></div></div>

  <div id="bubbles">
    <div class="bubble" id="bubbleThu">
      <canvas class="cakeCv" width="120" height="95"></canvas>
      <div class="tag">thursday</div>
      <div class="label"><div class="big">4–9pm</div><div>24th Sept</div></div>
    </div>
    <div class="bubble" id="bubbleMon">
      <canvas class="openCv" width="120" height="95"></canvas>
      <div class="tag">flexible</div>
      <div class="label"><div class="big">next Monday</div><div>onwards</div></div>
    </div>
  </div>

  <div id="farewell"><div class="card">
    <div class="big">happy birthday!</div>
    <div class="mid">cake's booked for:</div>
    <div class="pick" id="pick"></div>
    <div class="end">see you there.</div>
    <a id="calBtn" href="#" target="_blank" rel="noopener">+ add to google calendar</a>
  </div></div>

  <div id="proposeBox"><div class="card">
    <div class="big">proposed</div>
    <div class="pick" id="proposedWhere"></div>
    <div class="end">your move — Ash</div>
  </div></div>

  <button id="reset">replay</button>
</div>

/* birthday party hat, drawn once as pixel art */
const hatCv=document.getElementById('hatCv');
const hcx=hatCv.getContext('2d');
(function drawHat(){
  hcx.clearRect(0,0,22,26);
  const bands=['#4aa8ff','#ffd24a','#ff8fb1'];
  const apexY=6, baseY=24, baseHalf=9;
  for(let y=apexY;y<baseY;y++){
    const k=(y-apexY)/(baseY-apexY);
    const halfW=Math.max(1,Math.round(k*baseHalf));
    const band=bands[Math.min(bands.length-1,Math.floor(k*bands.length))];
    hcx.fillStyle=band;
    hcx.fillRect(11-halfW,y,halfW*2,1);
  }
  hcx.fillStyle='#fff';
  hcx.beginPath();hcx.arc(11,5,2.6,0,7);hcx.fill();
  hcx.fillStyle='#fdf8ef';hcx.fillRect(10,4,1,1);
})();

/* clouds + grass blades */
const sky=document.getElementById('sky');
for(let i=0;i<4;i++){const c=document.createElement('canvas');
  c.width=90;c.height=44;c.className='cloud';
  const cx=c.getContext('2d');cx.fillStyle='rgba(255,255,255,.95)';
  [[20,26,14],[38,20,18],[58,26,15],[40,30,20]].forEach(([x,y,r])=>{
    cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();});
  c.style.top=(6+i*13)+'%';c.style.left='-140px';
  c.style.width='120px';c.style.animationDuration=(26+i*10)+'s';
  c.style.animationDelay=(-i*7)+'s';sky.appendChild(c);}
const grass=document.getElementById('grass');
for(let i=0;i<60;i++){const b=document.createElement('div');b.className='blade';
  b.style.left=(i/60*100)+'%';b.style.height=(8+Math.random()*14)+'px';
  b.style.animationDelay=(-Math.random()*2.6)+'s';
  b.style.background=Math.random()>.5?'#4e9440':'#57a24a';grass.appendChild(b);}

/* vomit pool + a slice of cake */
const pool=document.getElementById('pool'),px2=pool.getContext('2d');
function drawPool(t){
  px2.clearRect(0,0,220,90);
  const hue=(t*60)%360;
  px2.fillStyle='hsl('+((hue)%360)+',85%,50%)';blob(px2,110,64,92,26,t);
  px2.fillStyle='hsl('+((hue+50)%360)+',90%,58%)';blob(px2,110,60,82,20,t*1.1);
  px2.fillStyle='hsl('+((hue+110)%360)+',90%,62%)';blob(px2,104,58,60,15,t*1.25);
  px2.fillStyle='hsl('+((hue+180)%360)+',95%,70%)';blob(px2,96,56,32,9,t*1.3);
  for(let i=0;i<7;i++){px2.fillStyle='hsl('+((hue+i*40)%360)+',95%,75%)';
    px2.fillRect(70+i*12+Math.sin(t*3+i)*3,52+Math.cos(t*2+i)*4,3,3);}
  // birthday cake slice (layered sponge + frosting + sprinkles)
  px2.save();px2.translate(78,52);px2.rotate(-.15+Math.sin(t)*.03);
  px2.beginPath();px2.moveTo(-16,8);px2.lineTo(14,8);px2.lineTo(-10,-12);px2.closePath();
  px2.save();px2.clip();
  px2.fillStyle='#e8b98a';px2.fillRect(-20,-2,40,12);
  px2.fillStyle='#f0a9b8';px2.fillRect(-20,-6,40,4);
  px2.fillStyle='#f3cda0';px2.fillRect(-20,-10,40,4);
  px2.fillStyle='#ffffff';px2.fillRect(-20,-15,40,5);
  px2.restore();
  px2.strokeStyle='rgba(120,80,40,.35)';px2.lineWidth=1;px2.stroke();
  const spr=['#ff6b81','#4aa8ff','#8fd66b','#ffd24a'];
  for(let i=0;i<5;i++){px2.fillStyle=spr[i%spr.length];
    px2.fillRect(-12+i*5,-14+((i%2)?1:0),2,1);}
  px2.restore();
  straw(px2,132,50+Math.sin(t)*1.5,.2);straw(px2,150,58+Math.cos(t*1.2)*1.5,-.3);
}
function blob(c,x,y,w,h,t){c.beginPath();
  for(let a=0;a<=6.3;a+=.35){const rd=1+Math.sin(a*3+t)*.05;
    c.lineTo(x+Math.cos(a)*w/2*rd,y+Math.sin(a)*h/2*rd);}c.closePath();c.fill();}
function straw(c,x,y,rot){c.save();c.translate(x,y);c.rotate(rot);
  c.fillStyle='#e8425f';c.beginPath();c.moveTo(-6,-6);
  c.quadraticCurveTo(6,-8,7,2);c.quadraticCurveTo(4,12,-1,11);
  c.quadraticCurveTo(-8,6,-6,-6);c.fill();
  c.fillStyle='#ffe07a';for(let i=0;i<5;i++)c.fillRect(-4+i*2,-2+(i%2)*4,1,1);
  c.fillStyle='#4caf50';c.beginPath();c.moveTo(-6,-6);c.lineTo(-2,-11);
  c.lineTo(0,-6);c.lineTo(3,-11);c.lineTo(6,-6);c.fill();c.restore();}
function line(c,a,b,d,e){c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke();}

/* bubble scene backgrounds: cake+confetti for Thursday, note+pencil for flexible */
const cakeCv=document.querySelector('.cakeCv'),wcx=cakeCv.getContext('2d');
const openCv=document.querySelector('.openCv'),bcx=openCv.getContext('2d');
function drawCakeScene(t){
  wcx.clearRect(0,0,120,95);
  wcx.fillStyle='#2a1830';wcx.fillRect(0,0,120,95);
  const g=wcx.createRadialGradient(60,50,8,60,55,75);
  g.addColorStop(0,'rgba(255,180,90,.4)');g.addColorStop(1,'rgba(255,180,90,0)');
  wcx.fillStyle=g;wcx.fillRect(0,0,120,95);
  wcx.save();wcx.translate(60,70);
  wcx.fillStyle='#e8b98a';wcx.fillRect(-22,-6,44,16);
  wcx.fillStyle='#f0a9b8';wcx.fillRect(-22,-10,44,5);
  wcx.fillStyle='#fff';wcx.fillRect(-22,-16,44,7);
  wcx.fillStyle='#4aa8ff';wcx.fillRect(-2,-26,4,10);
  const flick=0.7+Math.sin(t*10)*0.3;
  wcx.fillStyle='rgba(255,200,80,'+flick+')';
  wcx.beginPath();wcx.arc(0,-28,3,0,7);wcx.fill();
  wcx.restore();
  const cc=['#ff6b81','#4aa8ff','#8fd66b','#ffd24a','#ff9ec4'];
  for(let i=0;i<12;i++){
    const cx=8+i*9, cy=(t*45+i*23)%95;
    wcx.fillStyle=cc[i%cc.length];wcx.fillRect(cx,cy,3,3);
  }
}
function drawOpenScene(t){
  bcx.clearRect(0,0,120,95);
  bcx.fillStyle='#1c2a3a';bcx.fillRect(0,0,120,95);
  const g=bcx.createLinearGradient(0,0,0,95);
  g.addColorStop(0,'rgba(140,180,220,.35)');g.addColorStop(1,'rgba(140,180,220,0)');
  bcx.fillStyle=g;bcx.fillRect(0,0,120,95);
  bcx.save();bcx.translate(60,50);bcx.rotate(-0.05+Math.sin(t*1.5)*0.02);
  bcx.fillStyle='#fdf8ef';bcx.fillRect(-30,-20,60,40);
  bcx.strokeStyle='#d9cdb4';bcx.lineWidth=1;
  for(let i=0;i<4;i++){line(bcx,-24,-10+i*8,24,-10+i*8);}
  bcx.save();bcx.translate(14,10);bcx.rotate(-0.6);
  bcx.fillStyle='#e0955f';bcx.fillRect(-3,-16,6,16);
  bcx.fillStyle='#f4d9a0';bcx.beginPath();bcx.moveTo(-3,-16);bcx.lineTo(3,-16);bcx.lineTo(0,-22);bcx.closePath();bcx.fill();
  bcx.fillStyle='#3a2a1a';bcx.beginPath();bcx.moveTo(-1,-19);bcx.lineTo(1,-19);bcx.lineTo(0,-22);bcx.closePath();bcx.fill();
  bcx.restore();
  bcx.restore();
  for(let i=0;i<5;i++){
    const sx=10+i*22, sy=10+((t*20+i*13)%70);
    bcx.fillStyle='rgba(255,255,255,'+(0.3+0.3*Math.sin(t*2+i))+')';
    bcx.fillRect(sx,sy,2,2);
  }
}

const wrap=document.getElementById('mouseWrap'),banner=document.getElementById('banner'),
hint=document.getElementById('hint'),dateQ=document.getElementById('dateQ'),
bubbles=document.getElementById('bubbles'),farewell=document.getElementById('farewell'),
proposeBox=document.getElementById('proposeBox'),stage=document.getElementById('stage');
let state='walk',t0=performance.now(),raf;
let startX=null,dragX=0,liftY=0,swingFromX=0,lifted=false,dateShown=false;
let pickedLocation='';
let mPos={x:innerWidth/2,y:innerHeight*0.60};
let curSprite='';
function sprite(src){
  if(curSprite!==src){
    curSprite=src; img.src=src;
    mouseInner.classList.toggle('pose-walk', src===WALK);
    mouseInner.classList.toggle('pose-sit', src===SIT);
  }
}
const setBanner=h=>{banner.innerHTML=h;banner.classList.add('show');};
const hideBanner=()=>banner.classList.remove('show');
const setHint=h=>{hint.innerHTML=h;hint.classList.add('show');};
const hideHint=()=>hint.classList.remove('show');
const posWrap=()=>{wrap.style.left=mPos.x+'px';wrap.style.top=mPos.y+'px';};
function setMouse(o){
  sprite(o.sprite||WALK);
  const fd=o.faceDir||1;
  mouseInner.style.transform='scaleX('+fd+')';
  wrap.style.transform='translate(-50%,-50%) rotate('+(o.tilt||0)+'rad) scale('+(o.scale||1)+')';
  if(o.green){img.style.filter='hue-rotate(70deg) saturate(1.3)';}
  else img.style.filter='none';
}
const easeIn=k=>k*k;
function loop(now){
  const t=(now-t0)/1000,tt=now/1000;
  drawPool(t*3);
  if(bubbles.classList.contains('show')){drawCakeScene(tt);drawOpenScene(tt);}
  if(state==='walk'){
    const span=Math.min(innerWidth*0.30,220),dir=Math.sin(t*0.6);
    mPos.x=innerWidth/2+dir*span;mPos.y=innerHeight*0.60;posWrap();
    setMouse({sprite:WALK,faceDir:dir>=0?1:-1});
    setHint('pick up the mouse');hideBanner();
  }else if(state==='lifted'){
    mPos.x=dragX;mPos.y=Math.max(innerHeight*0.30,liftY);posWrap();
    setMouse({sprite:SIT,faceDir:1,tilt:Math.sin(t*10)*0.12});
    hideHint();setBanner('swipe left to right! <span class="arrow">&#10145;</span>');
  }else if(state==='swing'){
    const dur=0.9,k=Math.min(t/dur,1);
    const ease=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    mPos.x=swingFromX+(innerWidth-100-swingFromX)*ease;
    mPos.y=innerHeight*0.42+Math.sin(k*Math.PI)*-40;posWrap();
    setMouse({sprite:WALK,faceDir:1,tilt:ease*Math.PI*2.2});
    hideBanner();if(k>=1){state='slide';t0=now;}
  }else if(state==='slide'){
    const dur=1.1,k=Math.min(t/dur,1);
    mPos.x=innerWidth-100;
    mPos.y=innerHeight*0.30+(innerHeight*0.60-innerHeight*0.30)*easeIn(k);posWrap();
    setMouse({sprite:SIT,faceDir:1,tilt:Math.PI*0.5});
    if(k>=1){state='sway';t0=now;}
  }else if(state==='sway'){
    const dur=2.4,k=Math.min(t/dur,1);
    mPos.x=innerWidth-100;mPos.y=innerHeight*0.60;posWrap();
    setMouse({sprite:SIT,faceDir:1,tilt:Math.sin(t*3)*0.3,green:t>1});
    if(k>=1){state='heave';t0=now;}
  }else if(state==='heave'){
    const dur=0.9,k=Math.min(t/dur,1);
    mPos.x=innerWidth-100;mPos.y=innerHeight*0.60-Math.sin(k*Math.PI)*10;posWrap();
    setMouse({sprite:SIT,faceDir:-1,tilt:-k*0.3,green:true});
    if(k>=1){state='vomit';t0=now;showPool();}
  }else if(state==='vomit'){
    mPos.x=innerWidth-100;mPos.y=innerHeight*0.60;posWrap();
    setMouse({sprite:SIT,faceDir:-1,tilt:0.12,green:true});
    if(t>0.8&&!dateShown){dateShown=true;dateQ.classList.add('show');}
  }else if(state==='rest'){
    mPos.x=innerWidth-100;mPos.y=innerHeight*0.60;posWrap();
    setMouse({sprite:SIT,faceDir:-1,tilt:Math.PI*0.1});
  }
  raf=requestAnimationFrame(loop);
}
function showPool(){pool.style.left=(innerWidth-100)+'px';pool.style.top=(innerHeight*0.60+30)+'px';
  pool.style.transform='translate(-50%,0) scale(1)';}
function pdown(e){
  if(state!=='walk')return;
  const p=getXY(e),r=wrap.getBoundingClientRect();
  if(p.x>=r.left-30&&p.x<=r.right+30&&p.y>=r.top-30&&p.y<=r.bottom+30){
    lifted=true;state='lifted';t0=performance.now();
    wrap.classList.remove('grabbable');wrap.classList.add('grabbing');
    startX=p.x;dragX=p.x;liftY=p.y;e.preventDefault();}
}
function pmove(e){
  if(state!=='lifted'||!lifted)return;
  const p=getXY(e);dragX=p.x;liftY=Math.min(innerHeight*0.42,p.y);
  if(p.x-startX>90){swingFromX=startX;state='swing';t0=performance.now();
    wrap.classList.remove('grabbing');lifted=false;}
  e.preventDefault();
}
function pup(){
  if(state==='lifted'&&dragX-startX<=90){state='walk';t0=performance.now();
    wrap.classList.add('grabbable');wrap.classList.remove('grabbing');}
  lifted=false;
}
const getXY=e=>e.touches&&e.touches[0]?{x:e.touches[0].clientX,y:e.touches[0].clientY}
  :e.changedTouches&&e.changedTouches[0]?{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}
  :{x:e.clientX,y:e.clientY};
stage.addEventListener('mousedown',pdown);
window.addEventListener('mousemove',pmove);
window.addEventListener('mouseup',pup);
stage.addEventListener('touchstart',pdown,{passive:false});
window.addEventListener('touchmove',pmove,{passive:false});
window.addEventListener('touchend',pup);

document.getElementById('oceanBtn').addEventListener('click',()=>{
  pickedLocation='By the ocean';dateQ.classList.remove('show');bubbles.classList.add('show');});
document.getElementById('peakBtn').addEventListener('click',()=>{
  pickedLocation='By the peak';dateQ.classList.remove('show');bubbles.classList.add('show');});

function calUrl(d){
  const base='https://calendar.google.com/calendar/render?action=TEMPLATE';
  return base+'&text='+encodeURIComponent(d.title)
    +'&dates='+d.start+'/'+d.end
    +'&location='+encodeURIComponent(d.loc||'')
    +'&details='+encodeURIComponent('cake time \u2014 see you there. \u2014 Ash');
}
document.getElementById('bubbleThu').addEventListener('click',()=>{
  bubbles.classList.remove('show');state='rest';t0=performance.now();
  document.getElementById('pick').textContent=pickedLocation+'\nThursday, 24th Sept \u00b7 4\u20139pm';
  document.getElementById('calBtn').href=calUrl({
    title:'cakes not pastries with Ash',loc:pickedLocation,
    start:'20260924T160000',end:'20260924T210000'});
  farewell.classList.add('show');
});
document.getElementById('bubbleMon').addEventListener('click',()=>{
  bubbles.classList.remove('show');state='rest';t0=performance.now();
  document.getElementById('proposedWhere').textContent=pickedLocation+'\nanytime from next Monday';
  proposeBox.classList.add('show');
});

function fullReset(){
  state='walk';t0=performance.now();dateShown=false;lifted=false;startX=null;pickedLocation='';
  img.style.filter='none';
  pool.style.transform='translate(-50%,0) scale(0)';
  dateQ.classList.remove('show');bubbles.classList.remove('show');
  farewell.classList.remove('show');proposeBox.classList.remove('show');
  wrap.classList.add('grabbable');wrap.classList.remove('grabbing');
  mPos={x:innerWidth/2,y:innerHeight*0.60};posWrap();
}
document.getElementById('reset').addEventListener('click',fullReset);
posWrap();raf=requestAnimationFrame(loop);
</script>
</body>
